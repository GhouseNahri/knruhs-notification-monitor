name: KNRUHS admission page monitor

on:
  schedule:
    # GitHub scheduled workflows are best-effort and may start late.
    # This is approximately every 5 minutes, not a real-time guarantee.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      baseline_only:
        description: "Refresh baseline without sending alerts"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: knruhs-notice-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BASELINE_ONLY: ${{ inputs.baseline_only || false }}
        run: python monitor.py

      - name: Commit updated monitor state
        if: success()
        run: |
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet -- state.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+users.noreply.github.com"
              git commit -m "Update KNRUHS monitor state"
              git push
            fi
          fi
